html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
body { min-width: 320px; overflow-x: hidden; }
img, video, iframe { max-width: 100%; }
button, input, select, textarea { max-width: 100%; }
button, .btn, .nav-item, .tab { touch-action: manipulation; }
:focus-visible { outline: 3px solid #6BCBEB; outline-offset: 2px; }
.content { width: 100%; min-width: 0; }
.main, .app-shell, .content, .card, .grid, .row, .between { min-width: 0; }
.card, .facility-card, .stat { overflow-wrap: anywhere; }
.field input, .field select, .field textarea { min-height: 44px; }
.btn { min-height: 40px; }
.table-wrap { max-width: 100%; -webkit-overflow-scrolling: touch; }
.tabs { max-width: 100%; overflow-x: auto; flex-wrap: nowrap; scrollbar-width: thin; }
.tabs .tab { flex: 0 0 auto; white-space: nowrap; }
.modal-backdrop { overflow-y: auto; -webkit-overflow-scrolling: touch; }
.modal { max-height: calc(100dvh - 36px); overflow-y: auto; }

@media (min-width: 761px) and (max-width: 1050px) {
  .sidebar { width: 215px; }
  .main { margin-left: 215px; }
  .content { padding: 22px 20px 32px; }
  .grid-3, .grid-4 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .auth-layout { grid-template-columns: 42% 58%; }
  .auth-left { padding: 30px 7%; }
  .auth-right { padding: 28px 5%; }
}

@media (max-width: 760px) {
  body { font-size: 14px; }
  .app-shell { min-height: 100dvh; }
  .topbar {
    height: 60px;
    min-height: 60px;
    padding: 0 12px;
    gap: 8px;
  }
  .top-left { min-width: 0; gap: 9px; }
  .crumb {
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .top-actions { gap: 6px; flex: 0 0 auto; }
  .icon-btn { width: 40px; height: 40px; }
  .mobile-menu { display: grid; place-items: center; flex: 0 0 40px; }
  .sidebar {
    width: min(290px, 86vw);
    max-width: 86vw;
    transform: translateX(-105%);
    transition: transform .24s ease;
    padding-bottom: env(safe-area-inset-bottom);
  }
  .sidebar.mobile-open { transform: translateX(0); }
  .mobile-overlay.show { display: block; }
  .main, .collapsed .main { margin-left: 0; width: 100%; }
  .content {
    width: 100%;
    padding: 18px 14px calc(28px + env(safe-area-inset-bottom));
  }
  .page-title { font-size: clamp(21px, 6vw, 25px); line-height: 1.2; }
  .section { margin: 17px 0; }
  .section-head { gap: 9px; margin-bottom: 11px; }
  .section-head h2 { font-size: 17px; }
  .card { padding: 15px; border-radius: 14px; }
  .grid { gap: 11px; }
  .grid-2, .grid-3 { grid-template-columns: minmax(0, 1fr); }
  .grid-4 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .row, .between { min-width: 0; }
  .between { align-items: flex-start; flex-wrap: wrap; }
  .section-head > :last-child { max-width: 100%; }
  .section-head .btn, .between > .btn { max-width: 100%; }
  .btn { padding: 10px 12px; white-space: normal; }
  .btn-sm { min-height: 36px; }
  .field { margin: 9px 0; }
  .field input, .field select, .field textarea, .search { font-size: 16px; }
  .notice { padding: 11px 12px; }
  .stat { padding: 13px; }
  .stat .num { font-size: 22px; }
  .stat .label { line-height: 1.35; }
  .service-card { min-height: 105px; padding: 14px; }
  .facility-card { padding: 14px; }
  .facility-card .between { align-items: flex-start; }
  .role-card { padding: 14px; gap: 11px; }
  .role-card .btn { white-space: normal; }
  .auth-layout { display: flex; flex-direction: column; min-height: 100dvh; }
  .auth-left {
    min-height: auto;
    padding: 20px 6% 18px;
    gap: 14px;
  }
  .auth-left:after { width: 250px; height: 250px; right: -140px; top: 8%; }
  .auth-brand img { width: 48px; height: 48px; }
  .auth-brand strong { font-size: 17px; }
  .auth-hero { max-width: 100%; }
  .auth-hero h1 { font-size: clamp(25px, 7vw, 33px); max-width: 520px; }
  .auth-hero p { font-size: 13px; margin: 6px 0; }
  .hero-photo { display: none; }
  .auth-left-foot { margin-top: 2px; font-size: 11px; }
  .auth-right {
    padding: 24px 6% calc(28px + env(safe-area-inset-bottom));
    align-items: flex-start;
  }
  .auth-panel { width: 100%; }
  .auth-panel h2 { font-size: 24px; }
  .modal-backdrop { padding: 10px; align-items: end; }
  .modal {
    width: 100%;
    max-width: 560px;
    border-radius: 18px 18px 12px 12px;
    padding: 18px;
    margin: auto auto 0;
  }
  .toast {
    left: 12px;
    right: 12px;
    bottom: calc(12px + env(safe-area-inset-bottom));
    text-align: center;
  }
  .map-placeholder { height: 165px; }
  .footer { padding-bottom: 12px; }
}

@media (max-width: 420px) {
  .content { padding-left: 11px; padding-right: 11px; }
  .topbar { padding-left: 9px; padding-right: 9px; }
  .top-actions { gap: 4px; }
  .grid-4 { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 9px; }
  .grid-4 .card { padding: 12px; }
  .stat .num { font-size: 20px; }
  .stat .label { font-size: 10px; }
  .card { padding: 13px; }
  .role-emoji { width: 42px; height: 42px; flex: 0 0 42px; }
  .role-card h3 { font-size: 14px; }
  .role-card p { font-size: 10px; }
  .page-title { font-size: 21px; }
  .btn { font-size: 12px; }
  .pill { white-space: normal; }
}

@media (max-width: 360px) {
  .grid-4 { grid-template-columns: 1fr 1fr; }
  .content { padding-left: 9px; padding-right: 9px; }
  .topbar { gap: 5px; }
  .crumb { font-size: 10px; }
  .auth-right { padding-left: 5%; padding-right: 5%; }
}

@media (max-height: 520px) and (max-width: 760px) {
  .auth-left { padding-top: 14px; padding-bottom: 12px; }
  .auth-left-foot { display: none; }
  .auth-right { padding-top: 16px; }
}

function shell(){let groups=navs[role],person=people[role],isAdmin=role==='admin';let nav=groups.map(g=>`<div class="nav-label">${g[0]}</div>${g[1].map(n=>`<button class="nav-item ${page===n[0]?'active':''}" data-go="${n[0]}"><span class="ni">${n[1]}</span><span>${n[2]}</span></button>`).join('')}`).join('');return `<div class="app-shell ${collapsed?'collapsed':''}"><div class="mobile-overlay ${mobileOpen?'show':''}" data-action="close-mobile"></div><aside class="sidebar ${isAdmin?'admin':''} ${mobileOpen?'mobile-open':''}">${logoBlock()}<div class="nav-list">${nav}</div><div class="nav-bottom"><div class="user-mini"><div class="avatar">${person[0]}</div><div><strong>${person[1]}</strong><small>${person[2]}</small></div></div><button class="nav-item" data-action="logout"><span class="ni">↪</span><span class="logout-label">Logout</span></button></div></aside><main class="main"><header class="topbar"><div class="top-left"><button class="icon-btn mobile-menu" data-action="mobile-menu">☰</button><button class="icon-btn hide-mobile" data-action="collapse">☷</button><span class="crumb">${role==='patient'?'Patient portal':role==='staff'?facilities[0].name+' / Staff workspace':'Administration'} / ${navs[role][0][1].find(n=>n[0]===page)?.[2]||'Workspace'}</span></div><div class="top-actions"><span class="small muted hide-mobile">English · PH</span><button class="icon-btn" data-go="${role==='patient'?'notifications':role==='staff'?'staff-notifications':'activity-logs'}">♧</button><button class="icon-btn" data-go="${role==='patient'?'profile':role==='staff'?'staff-profile':'admin-profile'}">◉</button></div></header><div class="content">${pageContent()}<div class="footer">HOPPING · Right Care. Right Place. Less Waiting. <span style="float:right">Sample information · 04 Nov 2026</span></div></div></main></div>`}
function heading(kicker,title,sub,action=''){return `<div class="section-head"><div><div class="eyebrow">${kicker||''}</div><h1 class="page-title">${title}</h1><div class="muted small">${sub||''}</div></div>${action}</div>`}
function stat(n,l,d=''){return `<div class="card stat"><div class="num">${n}</div><div class="label">${l}</div>${d?`<div class="delta">${d}</div>`:''}</div>`}
function facilityCard(f,i){return `<article class="card facility-card"><div class="between"><span class="eyebrow">${f.type}</span><button class="icon-btn" title="Save facility" data-save="${i}">♡</button></div><h3>${f.name}</h3><div class="facility-meta">⌖ ${f.loc}${/\d/.test(f.distance)?' · '+f.distance+' away':''}</div><div style="margin:11px 0">${statusPill(f)}</div><div>${f.services.map(s=>`<span class="tag">${s}</span>`).join('')}</div><p class="small muted" style="margin-top:10px">Updated ${f.updated} · Referral: ${f.referral}</p><div class="row" style="margin-top:12px"><button class="btn btn-outline btn-sm" data-facility="${i}">View Details</button><button class="btn btn-primary btn-sm" data-before="${i}">Check Before I Go</button></div></article>`}

</p><button class="btn btn-outline btn-sm" data-go="notifications">Read announcement →</button></div></div><div class="notice danger">⚠ Need emergency care? Seek emergency medical care immediately or call 911. Do not delay emergency care to check HOPPING.</div>`;
case'services':return `${heading('Step 1 of 3 · Choose a service','What healthcare service do you need?','Choose a service to explore nearby facilities. You can check availability before visiting.')}<input class="search" placeholder="⌕ Search healthcare services" id="service-search"><div class="grid grid-3 section" id="service-grid">${services.map(s=>`<button class="service-card ${selectedService===s[0]?'selected':''}" data-service="${s[0]}"><span class="s-icon">${s[2]}</span><strong>${s[0]}</strong><small>${s[1]}</small></button>`).join('')}</div><div class="between"><div class="notice">ⓘ A guide, not a diagnosis. HOPPING does not diagnose medical conditions or replace professional medical advice, emergency services, or clinical triage.</div><button class="btn btn-primary" data-go="urgency">Continue to Urgency Guide →</button></div><div class="notice danger section">In a medical emergency, seek care immediately or call 911.</div>`;

case'facility-detail':{let f=facilities[selectedFacility];return `${heading('Facility details',f.name,`${f.type} · ${f.loc}${/\d/.test(f.distance)?' · '+f.distance+' away':''}`,`<button class="btn btn-outline" data-action="save-current">♡ Save Facility</button>`)}<div class="grid grid-2"><div class="card"><div class="between"><h3>Current acceptance status</h3>${statusPill(f)}</div><p class="small muted">Updated ${f.updated}</p><div class="notice" style="margin-top:14px"><b>Requested service · ${selectedService}</b><br>${f.services.includes(selectedService)?'Service is listed by this facility. Confirm today’s schedule directly.':'This service is not listed. Contact the facility for guidance.'}<br>Referral: ${f.referral}</div><p class="small muted">${f.remark}</p><button class="btn btn-primary" data-before="${selectedFacility}">Check Before I Go</button><button class="btn btn-outline section" data-action="create-referral">Send Care Request</button></div><div class="card"><h3>Contact & opening hours</h3><p>◷ ${f.hours}</p><p>⌖ ${f.loc}</p><p>☎ ${f.phone}</p><div class="row" style="margin-top:12px"><a class="btn btn-outline btn-sm" href="tel:${f.phone.replace(/[^0-9+]/g,'')}">Call Facility</a><a class="btn btn-outline btn-sm" target="_blank" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(f.name+' '+f.loc)}">Directions ↗</a></div></div></div><div class="card section"><h3>Available services</h3><div class="table-wrap"><table><thead><tr><th>Service</th><th>Availability</th><th>Schedule / referral info</th></tr></thead><tbody>${f.services.map(s=>`<tr><td>${s}</td><td><span class="pill accept">Listed</span></td><td>Contact facility to confirm</td></tr>`).join('')}</tbody></table></div></div><div class="grid grid-2"><div class="card"><h3>Location & directions</h3><div class="map-placeholder"><span class="map-pin">📍</span></div><p class="small muted">Illustrative map area · Open directions for route information.</p></div><div class="card"><h3>Prepare for your visit</h3><p>Bring a valid ID, relevant records, and any referral or test requests you already have.</p><button class="btn btn-secondary" data-go="before">Open Before You Go Checklist</button><div class="divider"></div><h4>Need other options?</h4><button class="btn btn-outline btn-sm" data-go="facilities">Compare Alternative Facilities</button></div></div><div class="notice warn">Before visiting, contact the facility to confirm service availability. Availability may change due to demand, staffing, and schedules. This update is not a reservation or guarantee of care.</div>`}

a></div><div class="notice danger section">Emergency? Seek medical care immediately or call 911.</div>`;
case'already':return `${heading('Patient workspace','Already at a hospital?','We can help you explore other healthcare facilities if you need additional options.')}<div class="notice warn"><b>Talk with your care team first.</b><br>Ask the hospital's patient navigator or healthcare professional whether referral to another facility is appropriate. Do not leave or interrupt ongoing care based on a HOPPING listing.</div><div class="grid grid-2 section"><div class="card"><div class="field"><label>Current facility</label><select>${facilities.map(f=>`<option>${f.name}</option>`).join('')}</select></div><div class="field"><label>Service to explore</label><select name="serviceName">${services.map(s=>`<option>${s[0]}</option>`).join('')}</select></div><button class="btn btn-primary" data-go="facilities">Find Alternative Facilities</button></div><div class="card"><h3>What to compare</h3><p><b>Services and hours</b> — Confirm the specific care you need is offered.</p><p><b>Referral information</b> — Ask your care team what documents are required.</p><p><b>Contact and transport</b> — Confirm the receiving facility and safe travel arrangements.</p></div></div><div class="grid grid-2">${facilities.slice(0,2).map(facilityCard).join('')}</div><div class="notice danger section">If your condition worsens, alert the healthcare staff caring for you immediately.</div>`;

case'saved':return `${heading('Patient workspace','Saved facilities','Facilities you have bookmarked for easier access.')}<div class="grid grid-2">${apiReady?(facilities.map((f,i)=>savedIds.includes(f.id)?facilityCard(f,i):'').join('')||'<div class="notice">You have not saved any facilities yet.</div>'):facilityCard(facilities[0],0)+facilityCard(facilities[1],1)}</div>`;
case'notifications':case'staff-notifications':return `${heading('Patient workspace','Notifications','Updates about your referrals, saved facilities, and account.')}<div class="between section"><div class="tabs"><button class="tab active">All notifications</button><button class="tab">Unread · 3</button><button class="tab">Referrals</button><button class="tab">Facilities</button></div><button class="btn btn-outline btn-sm" data-action="mark-read">Mark All as Read</button></div>${[['Your referral was accepted','REF-0261 · Bukidnon Provincial Medical Center accepted the specialist consultation referral. Review the instructions before visiting.','Today · 9:25 AM'],['Bukidnon Provincial Hospital - Maramag updated its services','Laboratory availability is limited today. General consultation remains available. Please call to confirm.','Today · 9:30 AM'],['Vaccination clinic this week','Routine vaccination is available at Bukidnon Provincial Hospital - Maramag, Monday–Friday, 8 AM–3 PM.','Today · 8:45 AM'],['Your profile was updated','Your contact preferences were updated.','Yesterday · 4:20 PM']].map(n=>`<div class="card row section"><div class="avatar">♧</div><div style="flex:1"><b>${n[0]}</b><p class="small muted">${n[1]}</p><span class="tiny muted">${n[2]} · Unread</span></div><span class="pill referral">Update</span></div>`).join('')}`;
case'profile':case'staff-profile':case'admin-profile':return `${heading('Account settings','My profile & settings','Manage your personal details, account security, and notification preferences.')}<div class="tabs"><button class="tab active">Personal information</button><button class="tab">Account & security</button><button class="tab">Notifications</button></div><div class="grid grid-2"><div class="card"><h3>Personal & contact information</h3><div class="grid grid-2"><div class="field"><label>First name</label><input name="firstName" value="${pv('first',role==='patient'?'Maria':role==='staff'?'Ana':'Daniel')}"></div><div class="field"><label>Last name</label><input name="lastName" value="${pv('last',role==='patient'?'Santos':role==='staff'?'Reyes':'Cruz')}"></div></div><div class="field"><label>Email address</label><input name="email" readonly value="${pv('email',role==='patient'?'maria.santos@example.com':role==='staff'?'ana.reyes@rosario.example.ph':'daniel.cruz@hopping.example.ph')}"></div><div class="field"><label>Mobile number</label><input name="phone" value="${pv('phone','+63 917 000 0123')}"></div><div class="field"><label>City / Municipality</label><input name="city" value="${pv('city','Valencia City, Bukidnon')}"></div><button class="btn btn-primary" data-action="save">Save Profile Changes</button></div><div class="card"><h3>Account & security</h3><p class="small muted">${people[role][2]} · Active account</p><div class="field"><label>Current password</label><input name="currentPw" type="password" autocomplete="current-password" placeholder="Enter current password"></div><div class="field"><label>New password</label><input name="newPw" type="password" autocomplete="new-password" placeholder="Create a new password"></div><div class="field"><label>Confirm new password</label><input name="confirmPw" type="password" autocomplete="new-password" placeholder="Re-enter new password"></div><button class="btn btn-outline" data-action="update-password">Update Password errals">Open Referral Management</button></div><div class="notice">Your access is limited to ${facilities[0].name}. Public updates are recorded in the activity history.</div>`;

 case'edit-service':openModal('Update service information',`<div class="field"><label>Service</label><select name="eservice">${(facilities[0].services||[]).map(x=>`<option>${x}</option>`).join('')}</select></div><div class="field"><label>Availability</label><select name="esstatus"><option>Available</option><option>Limited Capacity</option><option>Unavailable today</option></select></div><div class="field"><label>Public note</label><textarea name="esnote"></textarea></div>`,'Save Service');modalAction='edit-service';break;
 case'account-view':case'review':openModal('Review details',`<p>This record is available for review. Sensitive account and facility approval changes require a separate verified workflow.</p>`,'Close');break;

 case'referral-view':{const rid=a.dataset.referral;const rr=referrals.find(x=>x.id===rid);openModal('Referral details',`<p><b>${rr?.service||'Referral'}</b></p><p>${rr?.facilityName||''}</p><p>Status: ${rr?.status||'Pending'}</p><div class="field"><label>Staff note</label><textarea name="rnote">${rr?.staffNote||''}</textarea></div><div class="field"><label>Update status</label><select name="rstatus"><option>Pending</option><option>Accepted</option><option>Declined</option><option>Completed</option><option>Cancelled</option></select></div>`,'Save Update');modalAction='update-referral';window.activeReferralId=rid;break}
 case'export':exportCurrentData();break;
 case'filter':{let q=$('#service-filter')?.value||selectedService;selectedService=q;let accept=$('#accept-filter')?.checked;let list=facilities.filter(f=>f.services.includes(q)&&(!accept||f.status==='Accepting Patients'));$('#facility-results').innerHTML=list.map(f=>facilityCard(f,facilities.indexOf(f))).join('')||'<div class="notice">No sample facilities match these filters.</div>';$('#facility-count').textContent=list.length+' facilities found';break}
 case'clear-filter':render();break;
 case'modal-confirm':if(modalAction==='create-staff'){submitStaff();break}if(modalAction==='add-facility'){submitFacility();break}if(modalAction==='new-announcement'){submitAnnouncement();break}if(modalAction==='create-referral'){submitReferral();break}if(modalAction==='update-referral'){submitReferralUpdate();break}if(modalAction==='add-service'){submitService();break}if(modalAction==='staff-request'){submitStaffRequest();break}if(modalAction==='revoke-sessions'){revokeSessions();break}if(modalAction==='edit-capacity'){submitCapacityEdit();break}if(modalAction==='edit-service'){submitServiceUpdate();break}$('#modal-root').innerHTML='';if(page==='facility-status'&&apiReady){publishStatus();break}if(page==='login-admin'){go('admin-dashboard');toast('Signed in as administrator.')}else if(page==='facility-status'){toast('Connect the Railway API before publishing facility status.')}else toast('Confirmed.');break;
 }
});
document.addEventListener('submit',e=>{if(e.target.id==='auth-form'){e.preventDefault();handleAuthSubmit(e.target)}});
document.addEventListener('input',e=>{if(e.target.id==='service-search'){let q=e.target.value.toLowerCase();document.querySelectorAll('#service-grid [data-service]').forEach(el=>el.classList.toggle('hidden',!el.dataset.service.toLowerCase().includes(q)))}});
/* ===== HOPPING · Firebase Authentication + API layer =====
   Everything below connects the existing screens to Firebase and the HOPPING API.
   Configuration lives at the top of this script (FIREBASE_CONFIG and API_URL). hwuhuw miss na nko siya */
const fbReady=typeof firebase!=='undefined'&&!!FIREBASE_CONFIG.apiKey&&FIREBASE_CONFIG.apiKey!=='YOUR_API_KEY';
const apiReady=fbReady&&!!API_URL;
let fbAuth=null,profile=null,claims={},savedIds=[],modalAction=null,authBusy=false,referrals=[],adminUsers=[],activityLogs=[],announcements=[],adminSummary={};
const AUTH_PAGES=['welcome','roles','login-client','login-staff','login-admin','register','forgot'];
const STATUS_CLS={'Contact to Confirm':'referral','Accepting Patients':'accept','Limited Capacity':'limited','Referral Required':'referral','Temporarily Unable to Accept Certain Non-Emergency Cases':'unavailable'};
const PEOPLE_DEFAULT=JSON.parse(JSON.stringify(people));
const HOME={patient:'dashboard',staff:'staff-dashboard',admin:'admin-dashboard'};
if(fbReady){firebase.initializeApp(FIREBASE_CONFIG);fbAuth=firebase.auth()}

function pv(k,def){return profile&&profile[k]?profile[k]:def}
function normFac(f){return Object.assign({},f,{cls:STATUS_CLS[f.status]||'accept',services:f.services||[],updated:f.updated||'',remark:f.remark||''})}
function authMsg(e){const m={'auth/invalid-credential':'Incorrect email or password.','auth/wrong-password':'Incorrect email or password.','auth/user-not-found':'Incorrect email or password.','auth/invalid-email':'Please enter a valid email address.','auth/email-already-in-use':'An account with this email already exists.','auth/weak-password':'Password should be at least 6 characters.','auth/too-many-requests':'Too many attempts. Please wait a moment and try again.','auth/network-request-failed':'Network problem. Check your connection and try again.','auth/requires-recent-login':'Please sign in again before changing your password.'};return m[e.code]||e.message||'Something went wrong.'}

async function api(path,opts){if(!API_URL)throw new Error('Railway API URL is not configured. Add it in the HOPPING configuration.');opts=opts||{};const headers={'Content-Type':'application/json'};const u=fbAuth&&fbAuth.currentUser;if(u)headers.Authorization='Bearer '+await u.getIdToken();let res;const ctl=new AbortController();const tm=setTimeout(()=>ctl.abort(),20000);try{res=await fetch(API_URL+path,{method:opts.method||'GET',headers,signal:ctl.signal,body:opts.body?JSON.stringify(opts.body):undefined})}catch(e){clearTimeout(tm);throw new Error('Cannot reach the HOPPING server. Please try again shortly.')}clearTimeout(tm);const data=await res.json().catch(()=>({}));if(!res.ok)throw new Error(data.error||'Request failed ('+res.status+')');return data}

async function seedFacilities(){const rows=facilities.map(f=>({id:f.id,name:f.name,type:f.type,loc:f.loc,distance:f.distance,status:f.status,services:f.services,referral:f.referral,hours:f.hours,phone:f.phone,remark:f.remark}));return api('/api/admin/facilities/seed',{method:'POST',body:{facilities:rows}})}
async function loadFacilities(){if(!API_URL)return;try{let list=await api('/api/facilities');if(Array.isArray(list)&&!list.length&&role==='admin'){try{await seedFacilities();list=await api('/api/facilities')}catch(e){console.warn('Seeding facilities:',e.message)}}if(Array.isArray(list)&&list.length){facilities=list.map(normFac);if(role==='staff'&&claims.facilityId){const i=facilities.findIndex(f=>f.id===claims.facilityId);if(i>0)facilities.unshift(facilities.splice(i,1)[0])}if(!AUTH_PAGES.includes(page))render()}}catch(e){console.warn('Showing sample facilities:',e.message)}}

async function loadWorkspaceData(){
 if(!apiReady||!fbAuth.currentUser)return;
 try{referrals=await api('/api/referrals')}catch(e){console.warn('Referrals:',e.message)}
 if(role==='admin'){
  try{adminUsers=await api('/api/admin/users')}catch(e){console.warn('Users:',e.message)}
  try{activityLogs=await api('/api/admin/logs')}catch(e){console.warn('Logs:',e.message)}
  try{announcements=await api('/api/announcements')}catch(e){console.warn('Announcements:',e.message)}
  try{adminSummary=await api('/api/admin/summary')}catch(e){console.warn('Summary:',e.message)}
 }
 if(role==='staff'){
  try{const own=await api('/api/staff/facility');if(own){const i=facilities.findIndex(x=>x.id===own.id);if(i>=0)facilities[i]=normFac(own);else facilities.unshift(normFac(own));}}
  catch(e){console.warn('Assigned facility:',e.message)}
 }
}
function referralContent(){
 const rows=(referrals||[]).map(r=>`<tr><td>${r.id.slice(0,8).toUpperCase()} · ${r.createdAt?new Date(r.createdAt).toLocaleDateString('en-PH'):''}</td><td>${r.facilityName||'—'}</td><td>${r.receivingFacilityName||'Pending assignment'}</td><td>${r.service||'—'}</td><td><span class="pill ${r.status==='Accepted'?'accept':r.status==='Pending'?'limited':'referral'}">${r.status||'Pending'}</span> ${role!=='patient'?`<button class="btn btn-outline btn-sm" data-referral="${r.id}" data-action="referral-view">Review</button>`:''}</td></tr>`).join('');
 return `${heading('Care coordination',role==='staff'?'Referral management':'My referrals','Live referral records from the HOPPING database.')}<div class="card"><div class="table-wrap"><table><thead><tr><th>Reference / date</th><th>Facility</th><th>Receiving facility</th><th>Service</th><th>Status / action</th></tr></thead><tbody>${rows||'<tr><td colspan="5">No referral records yet.</td></tr>'}</tbody></table></div></div><div class="notice warn section">A referral record does not guarantee immediate service or replace clinical advice. Contact the facility to confirm schedules.</div>`;
}
function adminUsersContent(){
 const rows=(adminUsers||[]).map(u=>`<tr><td>${u.first||''} ${u.last||''}<div class="tiny muted">${u.email||''}</div></td><td>${u.role||'patient'}</td><td>${u.facilityId||'—'}</td><td>Active</td><td>${u.uid?u.uid.slice(0,10):''}</td></tr>`).join('');
 return `${heading('Administration','User management','Verified user records from Firebase and Firestore.',`<button class="btn btn-primary" data-action="create-staff">＋ Create Staff Account</button>`)}<div class="card"><div class="table-wrap"><table><thead><tr><th>Account</th><th>Role</th><th>Assigned facility</th><th>Status</th><th>UID</th></tr></thead><tbody>${rows||'<tr><td colspan="5">No user records returned.</td></tr>'}</tbody></table></div></div>`;
}
function adminLogsContent(){
 const rows=(activityLogs||[]).map(l=>`<tr><td>${l.at||''}</td><td>${l.actorEmail||l.actorUid||''}</td><td>${l.actorRole||''}</td><td>${l.action||''}</td><td>${JSON.stringify(l.detail||{})}</td></tr>`).join('');
 return `${heading('Administration','System activity logs','Live audit events recorded by the API.',`<button class="btn btn-primary" data-action="export">↓ Export Audit Log</button>`)}<div class="card"><div class="table-wrap"><table><thead><tr><th>Time</th><th>Actor</th><th>Role</th><th>Action</th><th>Details</th></tr></thead><tbody>${rows||'<tr><td colspan="5">No activity events returned.</td></tr>'}</tbody></table></div></div>`;
}
async function enterWorkspace(user,cl,fresh){claims=cl||{};role=claims.role||'patient';profile=null;if(API_URL){try{profile=await api('/api/me')}catch(e){console.warn(e.message)}}
 profile=profile||{};profile.email=profile.email||user.email;
 const dn=(user.displayName||'').split(' ');const first=profile.first||dn[0]||'',last=profile.last||dn.slice(1).join(' ')||'';
 const nm=[first,last].filter(Boolean).join(' ')||user.email;
 people[role][0]=((first[0]||'')+(last[0]||'')||user.email[0]).toUpperCase();people[role][1]=nm;profile.first=first;profile.last=last;
 savedIds=profile.saved||[];await loadFacilities();await loadWorkspaceData();
 if(role==='admin'&&fresh){page='login-admin';render();openModal('Additional verification','Multi-factor verification is not enabled for this project yet. Continue to open the administrator workspace.','Verify & Continue')}
 else go(HOME[role])}

async function handleAuthSubmit(form){
 if(!fbReady){toast('Firebase is not configured yet. Add your Firebase settings at the top of the script (see the setup guide).');return}
 const f=new FormData(form),email=(f.get('email')||'').trim(),pw=f.get('password')||'';const btn=form.querySelector('button[type=submit]');btn.disabled=true;authBusy=true;
 try{
  if(page==='forgot'){try{await fbAuth.sendPasswordResetEmail(email)}catch(e){}toast('If an eligible account exists, reset instructions will be sent.');return}
  if(page==='register'){const first=(f.get('firstName')||'').trim(),last=(f.get('lastName')||'').trim();
   const cred=await fbAuth.createUserWithEmailAndPassword(email,pw);await cred.user.updateProfile({displayName:(first+' '+last).trim()});
   if(API_URL){try{await api('/api/me',{method:'PUT',body:{first,last,phone:f.get('phone')||'',city:f.get('city')||'',notify:!!form.querySelector('[name=notify]')?.checked}})}catch(e){console.warn(e.message)}}
   cred.user.sendEmailVerification().catch(()=>{});const tok=await cred.user.getIdTokenResult(true);await enterWorkspace(cred.user,tok.claims,false);toast('Account created. We sent a verification link to your email.');return}
  const want=page==='login-staff'?'staff':page==='login-admin'?'admin':'patient';
  const cred=await fbAuth.signInWithEmailAndPassword(email,pw);const tok=await cred.user.getIdTokenResult(true);
  if((tok.claims.role||'patient')!==want){await fbAuth.signOut();toast('This account does not have access to the '+(want==='patient'?'Client / Patient':want==='staff'?'Hospital Staff':'Administrator')+' workspace.');return}
  await enterWorkspace(cred.user,tok.claims,true);
 }catch(e){toast(authMsg(e))}finally{authBusy=false;btn.disabled=false}}

async function doLogout(){try{if(fbAuth)await fbAuth.signOut()}catch(e){}profile=null;claims={};savedIds=[];Object.keys(PEOPLE_DEFAULT).forEach(k=>{people[k]=PEOPLE_DEFAULT[k].slice()});role='patient';go('welcome')}

async function toggleSaved(i){const f=facilities[i];if(!apiReady||!f||!f.id||!fbAuth.currentUser){toast('Facility saved to your list (demo).');return}
 try{if(savedIds.includes(f.id)){await api('/api/me/saved/'+f.id,{method:'DELETE'});savedIds=savedIds.filter(x=>x!==f.id);toast('Removed from your saved facilities.')}else{await api('/api/me/saved',{method:'POST',body:{facilityId:f.id}});savedIds.push(f.id);toast('Facility saved to your list.')}if(page==='saved')render()}catch(e){toast(e.message)}}

async function saveProfile(){if(!apiReady){toast('Changes saved in this demo. Connect a backend to persist data.');return}
 const g=n=>(document.querySelector('.content input[name="'+n+'"]')||{}).value;
 try{const p=await api('/api/me',{method:'PUT',body:{first:g('firstName'),last:g('lastName'),phone:g('phone'),city:g('city')}});profile=Object.assign(profile||{},p);people[role][1]=[profile.first,profile.last].filter(Boolean).join(' ')||people[role][1];toast('Profile saved.')}catch(e){toast(e.message)}}

async function updatePassword(){const g=n=>(document.querySelector('.content input[name="'+n+'"]')||{}).value||'';const cur=g('currentPw'),nw=g('newPw'),cf=g('confirmPw');
 if(!fbReady||!fbAuth.currentUser){toast('Changes saved in this demo. Connect a backend to persist data.');return}
 if(!cur||nw.length<6){toast('Enter your current password and a new password of at least 6 characters.');return}
 if(nw!==cf){toast('New password and confirmation do not match.');return}
 try{const u=fbAuth.currentUser;await u.reauthenticateWithCredential(firebase.auth.EmailAuthProvider.credential(u.email,cur));await u.updatePassword(nw);toast('Password updated.')}catch(e){toast(authMsg(e))}}

async function publishStatus(){const v=(document.querySelector('input[name="facility-status"]:checked')||{}).value||'Accepting Patients';const remark=($('#status-remark')||{}).value||'';const f=facilities[0];
 try{const upd=await api('/api/facilities/'+f.id+'/status',{method:'PUT',body:{status:v,remark}});facilities[0]=normFac(upd);render();toast('Facility status published.')}catch(e){toast(e.message)}}

async function submitStaff(){const g=n=>((document.querySelector('#modal-root [name="'+n+'"]')||{}).value||'').trim();
 const body={firstName:g('sfirst'),lastName:g('slast'),email:g('semail'),password:g('spass'),facilityId:g('sfacility')};
 if(!body.email||body.password.length<8){toast('Enter an email and a temporary password of at least 8 characters.');return}
 try{try{await api('/api/admin/staff',{method:'POST',body})}catch(e){if(e.message!=='Choose a valid facility.')throw e;await seedFacilities();await api('/api/admin/staff',{method:'POST',body})}$('#modal-root').innerHTML='';modalAction=null;toast('Staff account created. Ask them to change the temporary password after their first sign in.')}catch(e){toast(e.message)}}

async function saveChecklist(){
 const items=Array.from(document.querySelectorAll('.content .checklist')).map((el,i)=>el.checked?(el.parentElement?.textContent||'Checklist item '+(i+1)).trim():null).filter(Boolean);
 try{await api('/api/me',{method:'PUT',body:{checklist:items}});toast('Visit checklist saved to your account.')}catch(e){toast(e.message)}
}
async function markNotificationsRead(){try{await api('/api/me/notifications/read',{method:'POST'});toast('Notifications marked as read.')}catch(e){toast(e.message)}}
async function revokeSessions(){try{await api('/api/me/sessions/revoke',{method:'POST'});$('#modal-root').innerHTML='';await doLogout();toast('Other sessions revoked. Please sign in again.')}catch(e){toast(e.message)}}

async function saveOperationalPage(){
 try{
  if(page==='capacity'){
   const g=n=>document.querySelector('.content [name="'+n+'"]')?.value||'';
   await api('/api/staff/capacity',{method:'PUT',body:{capacity:[{service:'General Consultation',planned:g('capacityPlanned'),used:g('capacityUsed'),personnel:g('capacityPersonnel'),note:g('capacityNote')}]}});
   toast('Internal capacity information saved.');return;
  }
  if(page==='service-management'){
   const g=n=>document.querySelector('.content [name="'+n+'"]')?.value||'';
   const current=facilities[0].services||[];const service=g('serviceName');const services=Array.from(new Set([...current,service].filter(Boolean)));
   const details=facilities[0].serviceDetails||[];const serviceDetails=[...details.filter(x=>x.service!==service),{service,status:g('serviceStatus')||'Available',note:g('serviceNote')}];
   const f=await api('/api/staff/services',{method:'PUT',body:{services,serviceDetails}});facilities[0]=normFac(f);render();toast('Facility service list and availability note saved.');return;
  }
  if(page==='settings'){
   const g=n=>document.querySelector('.content [name="'+n+'"]')?.value||'';
   await api('/api/admin/settings',{method:'PUT',body:{displayName:g('displayName'),language:g('language'),timezone:g('timezone'),facilityReminder:g('facilityReminder'),supportContact:g('supportContact'),auditReason:g('auditReason')}});
   toast('Platform settings saved and audit-logged.');return;
  }
  if(page==='announcements'){
   const g=n=>document.querySelector('.content [name="'+n+'"]')?.value||'';
   await api('/api/admin/announcements',{method:'POST',body:{title:g('atitle'),audience:g('aaudience'),message:g('amessage')}});
   await loadWorkspaceData();render();toast('Announcement published.');return;
  }
 }catch(e){toast(e.message)}
}
async function submitCapacityEdit(){
 const g=n=>document.querySelector('#modal-root [name="'+n+'"]')?.value||'';
 const existing=(facilities[0].capacity||[]).filter(x=>x.service!==g('ecservice'));
 existing.push({service:g('ecservice'),planned:g('ecplanned'),used:g('ecused'),personnel:g('ecpersonnel'),note:g('ecnote')});
 try{await api('/api/staff/capacity',{method:'PUT',body:{capacity:existing}});facilities[0].capacity=existing;$('#modal-root').innerHTML='';modalAction=null;toast('Capacity record saved.')}catch(e){toast(e.message)}
}
async function submitServiceUpdate(){
 const g=n=>document.querySelector('#modal-root [name="'+n+'"]')?.value||'';
 const name=g('eservice');const services=facilities[0].services||[];const details=[...(facilities[0].serviceDetails||[]).filter(x=>x.service!==name),{service:name,status:g('esstatus'),note:g('esnote')}];
 try{const f=await api('/api/staff/services',{method:'PUT',body:{services,serviceDetails:details}});facilities[0]=normFac(f);$('#modal-root').innerHTML='';modalAction=null;render();toast('Service availability updated.')}catch(e){toast(e.message)}
}

async function submitService(){const v=document.querySelector('#modal-root [name="servicename"]')?.value?.trim();if(!v){toast('Enter a service name.');return}try{const services=Array.from(new Set([...(facilities[0].services||[]),v]));const f=await api('/api/staff/services',{method:'PUT',body:{services}});facilities[0]=normFac(f);$('#modal-root').innerHTML='';modalAction=null;render();toast('Service added to your facility.')}catch(e){toast(e.message)}}
async function submitStaffRequest(){const details=document.querySelector('#modal-root [name="requestDetails"]')?.value?.trim();if(!details){toast('Describe the correction you are requesting.');return}try{await api('/api/staff/requests',{method:'POST',body:{category:'Facility listing correction',details}});$('#modal-root').innerHTML='';modalAction=null;toast('Correction request submitted to the administrator.')}catch(e){toast(e.message)}}

async function saveFacilityProfile(){
 const g=n=>document.querySelector('.content input[name="'+n+'"]')?.value||'';
 try{const f=await api('/api/staff/facility',{method:'PUT',body:{phone:g('Public contact number'),hours:g('Opening hours')}});const i=facilities.findIndex(x=>x.id===f.id);if(i>=0)facilities[i]=normFac(f);render();toast('Assigned facility contact information saved.')}catch(e){toast(e.message)}
}
async function submitFacility(){const g=n=>document.querySelector('#modal-root [name="'+n+'"]')?.value?.trim()||'';const body={name:g('fname'),type:g('ftype'),loc:g('floc'),phone:g('fphone'),hours:g('fhours'),services:g('fservices').split(',').map(x=>x.trim()).filter(Boolean)};try{const f=await api('/api/facilities',{method:'POST',body});facilities.push(normFac(f));$('#modal-root').innerHTML='';modalAction=null;render();toast('Facility created and saved to Firestore.')}catch(e){toast(e.message)}}
async function submitAnnouncement(){const g=n=>document.querySelector('#modal-root [name="'+n+'"]')?.value?.trim()||'';try{await api('/api/admin/announcements',{method:'POST',body:{title:g('atitle'),audience:g('aaudience'),message:g('amessage')}});$('#modal-root').innerHTML='';modalAction=null;await loadWorkspaceData();render();toast('Announcement published.')}catch(e){toast(e.message)}}
async function submitReferral(){const g=n=>document.querySelector('#modal-root [name="'+n+'"]')?.value||'';try{const r=await api('/api/referrals',{method:'POST',body:{facilityId:facilities[selectedFacility].id,service:g('rservice')||selectedService,urgency:g('rurgency')||urgency,concern:g('rconcern')}});referrals.unshift(r);$('#modal-root').innerHTML='';modalAction=null;toast('Care request submitted.');}catch(e){toast(e.message)}}
async function submitReferralUpdate(){const g=n=>document.querySelector('#modal-root [name="'+n+'"]')?.value||'';try{await api('/api/referrals/'+encodeURIComponent(window.activeReferralId),{method:'PATCH',body:{status:g('rstatus'),note:g('rnote')}});$('#modal-root').innerHTML='';modalAction=null;await loadWorkspaceData();render();toast('Referral updated.')}catch(e){toast(e.message)}}
function exportCurrentData(){const rows=page==='activity-logs'?activityLogs:page.includes('referral')?referrals:adminUsers;const csv=[Object.keys(rows[0]||{message:'No records'}).join(','),...rows.map(r=>Object.values(r).map(v=>'"'+String(typeof v==='object'?JSON.stringify(v):v??'').replace(/"/g,'""')+'"').join(','))].join('\n');const blob=new Blob([csv],{type:'text/csv;charset=utf-8'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='hopping-'+page+'-'+new Date().toISOString().slice(0,10)+'.csv';a.click();URL.revokeObjectURL(url);}

if(fbReady){fbAuth.onAuthStateChanged(async u=>{if(authBusy||!u||!AUTH_PAGES.includes(page))return;try{const tok=await u.getIdTokenResult();await enterWorkspace(u,tok.claims,false)}catch(e){console.warn(e.message)}})}
loadFacilities();

render();
</script>
